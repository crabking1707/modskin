<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Modskin LQ - Make by Hiếu gamer</title>
<style>
:root{--ink:#0f172a;--mut:#64748b;--card:#fff;--cy:#22d3ee;--bg1:#e0f2fe;--bg2:#f5f3ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2) 60%,#ecfeff) fixed;min-height:100vh;padding-bottom:150px}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input{font:inherit}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.85);backdrop-filter:blur(14px);padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:10px;border-bottom:1px solid #e2e8f0}
.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#22d3ee,#7c3aed);color:#fff;font-weight:800;display:grid;place-items:center;font-size:15px;flex:none}
.brand{flex:1;min-width:0}.brand b{display:block;font-size:15px;letter-spacing:.3px}.brand small{color:var(--mut);font-weight:700;font-size:12px;letter-spacing:.8px;text-transform:uppercase}
.stepn{background:var(--ink);color:#fff;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px}
.credit{display:flex;align-items:center;gap:2px;background:linear-gradient(135deg,#ede9fe,#e0f2fe);border:1.5px solid #c4b5fd;border-radius:14px;padding:3px 4px 3px 10px;font-weight:800}
.credit .n{font-size:18px;min-width:18px;text-align:center;padding:2px 4px;border-radius:8px}
.credit .n.adm{background:#fef08a;outline:2px dashed #eab308}
.credit .plus{width:26px;height:26px;border-radius:9px;background:var(--ink);color:#fff;font-size:17px;line-height:1}
.credit.shake{animation:sh .4s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;font-weight:800;flex:none}
main{max-width:720px;margin:0 auto;padding:16px}
.pill{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid #e2e8f0;border-radius:99px;padding:6px 12px;font-weight:700;font-size:13px}
h1{font-size:30px;margin:14px 0 6px;letter-spacing:-.5px}p.sub{color:var(--mut);margin:0 0 16px;line-height:1.5}
.card{background:var(--card);border-radius:24px;padding:16px;box-shadow:0 6px 24px rgba(15,23,42,.06);margin-bottom:14px}
.dev{display:flex;gap:14px;align-items:flex-start;border:3px solid transparent;text-align:left;width:100%;margin-bottom:14px;position:relative}
.dev.on{border-color:var(--cy)}.dev .ic{font-size:38px;width:68px;height:68px;border-radius:20px;background:#f1f5f9;display:grid;place-items:center;flex:none}
.dev h3{margin:0 0 4px}.dev p{margin:0 0 8px;color:var(--mut);font-size:14px}
.tag{display:inline-block;font-size:11px;font-weight:800;padding:4px 9px;border-radius:99px;background:var(--ink);color:#fff;margin-right:6px;letter-spacing:.5px}.tag.l{background:#ecfeff;color:#0891b2;border:1px solid #a5f3fc}
.chk{position:absolute;top:14px;right:14px;width:28px;height:28px;border-radius:50%;border:2px solid #cbd5e1;display:grid;place-items:center;color:#fff;font-weight:800}
.on .chk{background:var(--cy);border-color:var(--cy)}
.cta{display:block;width:100%;background:var(--ink);color:#fff;border-radius:99px;padding:18px;font-weight:800;font-size:17px}
.cta:disabled{background:#cbd5e1;color:#94a3b8}
.search{width:100%;padding:15px 18px;border-radius:99px;border:1.5px solid #e2e8f0;background:#fff;margin-bottom:10px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{background:#fff;border:1.5px solid #e2e8f0;border-radius:99px;padding:8px 13px;font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}.dot{width:9px;height:9px;border-radius:50%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:10px}
.hero{background:#fff;border-radius:18px;padding:8px 4px 8px;text-align:center;border:2.5px solid transparent;position:relative}
.sp{display:block;flex:none;background-repeat:no-repeat;background-color:#e2e8f0}.hero .sp{margin:0 auto 5px;border-radius:16px}
.hero b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px}
.hero small{font-size:10px;color:var(--mut);font-weight:700}
.hero.on{border-color:var(--cy);box-shadow:0 0 0 4px rgba(34,211,238,.25)}
.bar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:696px;margin:0 auto;background:var(--ink);color:#fff;border-radius:26px;padding:12px;z-index:30;box-shadow:0 10px 30px rgba(15,23,42,.35)}
.bar .row{display:flex;align-items:center;gap:12px}.bar .s{flex:1;min-width:0;font-size:14px}.bar .s b{display:block}.bar .s span{color:#94a3b8;font-size:12px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .go{background:#fff;color:var(--ink);border-radius:99px;padding:14px 20px;font-weight:800}.bar .go:disabled{background:#334155;color:#94a3b8}
.bar .go.full{width:100%;margin-top:10px;font-size:16px}
.hh{display:flex;align-items:center;gap:12px;margin-bottom:12px}.hh .sp{border-radius:16px}.hh h3{margin:0}.hh small{color:var(--mut)}
.skins{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:560px){.skins{grid-template-columns:repeat(3,1fr)}}
.sk{border-radius:20px;overflow:hidden;background:#fff;border:3px solid #e2e8f0;text-align:left;position:relative}
.sk .top{height:92px;display:flex;align-items:flex-end;padding:8px}
.sk .top .sp{border-radius:15px;box-shadow:0 4px 12px rgba(0,0,0,.25);background-color:#fff}
.sk .bdg{position:absolute;top:8px;right:8px;background:rgba(255,255,255,.92);font-size:11px;font-weight:800;padding:4px 9px;border-radius:99px}
.sk .nm{padding:8px 10px 10px;font-weight:700;font-size:13px;line-height:1.25;min-height:50px}
.sk.on{border-color:#facc15;box-shadow:0 0 0 4px rgba(250,204,21,.3)}
.sk.on::after{content:"✓";position:absolute;top:8px;left:8px;background:#facc15;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:13px}
.t-def .top{background:linear-gradient(135deg,#f8fafc,#cbd5e1)}.t-A .top{background:linear-gradient(135deg,#6ee7b7,#0ea5e9)}
.t-S .top{background:linear-gradient(135deg,#ff8a7a,#ff3b30)}.t-Sp .top{background:linear-gradient(135deg,#22d3ee,#7c3aed)}
.t-SS .top{background:linear-gradient(135deg,#ffd60a,#ff8a00)}.t-SSS .top{background:linear-gradient(135deg,#ff7ad1,#7c3aed)}.t-k .top{background:linear-gradient(135deg,#94a3b8,#334155)}
.cam{display:flex;gap:8px;flex-wrap:wrap}.cam .chip{flex:1;justify-content:center;min-width:64px}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:50;display:grid;place-items:center;padding:16px}
.box{background:#fff;border-radius:26px;padding:22px;width:100%;max-width:420px;max-height:85vh;overflow:auto}
.box h2{margin:0 0 12px}.box input{width:100%;padding:14px 16px;border-radius:14px;border:1.5px solid #e2e8f0;margin-bottom:10px}
.link{color:#7c3aed;font-weight:800;text-decoration:underline}.err{color:#dc2626;font-size:13px;min-height:18px;margin:0 0 8px}
.urow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #f1f5f9;font-size:13px}.urow div{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}.urow input{width:64px;margin:0;padding:8px}
.toast{position:fixed;top:calc(70px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:99px;z-index:60;font-weight:700;font-size:14px;max-width:90%;text-align:center}
.topup{position:relative;padding-top:26px}
.x{position:absolute;top:10px;right:12px;width:34px;height:34px;border-radius:50%;background:#f1f5f9;font-weight:800;font-size:16px}
.offer{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;border-radius:20px;padding:16px 18px;margin-bottom:10px;font-size:17px;border:2px solid #e2e8f0;background:#fff}
.offer small{display:block;font-size:12px;color:var(--mut);font-weight:600;margin-top:2px}
.offer.free{background:linear-gradient(135deg,#22d3ee,#7c3aed);color:#fff;border:0}.offer.free small{color:#e0f2fe}
.offer.free:disabled{background:#cbd5e1;color:#64748b}.offer.free:disabled small{color:#64748b}
.offer.paid{font-weight:800;font-size:18px;justify-content:center}.qr{width:100%;max-width:220px;display:block;margin:4px auto 10px;border-radius:16px;border:1px solid #e2e8f0}.kv{display:flex;justify-content:space-between;gap:8px;padding:5px 0}.offer .soon{font-size:11px;font-weight:800;background:#f1f5f9;color:var(--mut);padding:4px 9px;border-radius:99px;white-space:nowrap}
.offer .rm{background:rgba(255,255,255,.25);padding:5px 12px;border-radius:99px;font-weight:800;white-space:nowrap}
.step{background:#f8fafc;border-radius:18px;padding:14px;margin-bottom:12px;font-size:14px;line-height:1.5}
a.lnk{display:block;text-align:center;background:var(--ink);color:#fff;text-decoration:none;font-weight:800;border-radius:99px;padding:15px;margin:10px 0}
.code{letter-spacing:6px;text-align:center;font-weight:800;font-size:22px;text-transform:uppercase}
.big{font-size:44px;letter-spacing:10px;font-weight:900;text-align:center;background:linear-gradient(135deg,#22d3ee,#7c3aed);-webkit-background-clip:text;background-clip:text;color:transparent;margin:10px 0}
.foot{text-align:center;color:var(--mut);font-size:12px;margin-top:20px}
.hide{display:none!important}
</style>
</head>
<body>
<header id="hd" class="hide">
  <div class="logo">MQ</div>
  <div class="brand"><b>LE VAN DUC HIEU - PREMIUM</b><small>Make by Hiếu gamer</small></div>
  <div class="credit" id="credit" title="Số lượt tạo file"><span class="n" id="cn">0</span><button class="plus" id="cplus">+</button></div>

</header>
<main id="app"></main>
<div id="barwrap"></div>
<div id="modal"></div>

<script src="data.js"></script>
<script type="module">
/* ============ CẤU HÌNH FIREBASE (dán config của bạn vào đây) ============ */
const firebaseConfig = {
  apiKey: "AIzaSyDMjqZzC185GkyxCJZwdTe0quEII9hyG60",
  authDomain: "modskin-fc16a.firebaseapp.com",
  projectId: "modskin-fc16a",
  storageBucket: "modskin-fc16a.firebasestorage.app",
  messagingSenderId: "812019824135",
  appId: "1:812019824135:web:e21a898a8a6ae654889ca2",
  measurementId: "G-NDC129VDH8"
};
const ADMIN_EMAIL = "baohieudeptrai.2009@gmail.com";
const CAMS = [5,15,25,30,40,50];
// Lấy điểm free: 4 lần/ngày, 2 lần đầu qua Layma rồi 2 lần sau qua Link4M
const PAY_API = '';   // '' = cùng thư mục với index.html (cùng tên miền). Nếu web ở tên miền khác: 'https://modskin.freedev.app/'
const PAY_BANK = 'MB', PAY_ACC = '0986211661', PAY_TTL = 30*60*1000;
const FREE_PER_DAY = 4, MIN_WAIT = 15, PENDING_TTL = 30*60*1000;
const SHORTENERS = [
  {name:'Layma', token:'3436e80b8e2230be4a19c350ad0d2ad4',
   api:(t,u)=>[`https://api.layma.net/api/admin/shortlink/quicklink?tokenUser=${t}&format=json&url=${u}`,`https://layma.net/api?api=${t}&url=${u}`],
   quick:(t,u)=>`https://layma.net/st?api=${t}&url=${u}`},
  {name:'Link4M', token:'69b0b29e9f192a135a24406f',

   quick:(t,u)=>`https://link4m.co/st?api=${t}&url=${u}`}
];
const shortenerFor = n => SHORTENERS[n<2?0:1];
/* ======================================================================== */

const H = window.LQ_DATA;
const ROLES = {"Đấu Sĩ":"#ff3b30","Xạ Thủ":"#ff9500","Pháp Sư":"#7c3aed","Trợ Thủ":"#10b981","Đỡ Đòn":"#0ea5e9","Sát Thủ":"#0f172a"};
const TIER = {"Mặc định":["t-def","Mặc Định"],"Bậc A":["t-A","Bậc A"],"Bậc S":["t-S","Bậc S"],"Bậc S+":["t-Sp","Bậc S+"],"Bậc SS":["t-SS","Bậc SS"],"Bậc SSS":["t-SSS","Bậc SSS"],"Khác":["t-k","Khác"]};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast = (m)=>{const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2600)};
const AT = window.LQ_ATLAS;
const sprite=(file,i,cols,rows,px)=>`<i class="sp" style="width:${px}px;height:${px}px;background-image:url(${file});background-size:${cols*px}px ${rows*px}px;background-position:-${(i%cols)*px}px -${Math.floor(i/cols)*px}px"></i>`;
const heroImg=(id,px)=>sprite(AT.heroes.file,H.find(h=>h.id===id).h,AT.heroes.cols,AT.heroes.rows,px);
const skinImg=(n,px)=>sprite(AT.skins.files[Math.floor(n/AT.skins.per)],n%AT.skins.per,AT.skins.cols,AT.skins.rows,px);

/* ---------- Backend: Firebase hoặc Demo (localStorage) ---------- */
const hasFB = !firebaseConfig.apiKey.startsWith("YOUR_");
let B;
if (hasFB) {
  const V="10.12.2",u=m=>`https://www.gstatic.com/firebasejs/${V}/firebase-${m}.js`;
  const [{initializeApp},A,F] = await Promise.all([import(u('app')),import(u('auth')),import(u('firestore'))]);
  const app=initializeApp(firebaseConfig), auth=A.getAuth(app), db=F.getFirestore(app);
  const ref=uid=>F.doc(db,'users',uid);
  const viaMsg=e=>({"auth/email-already-in-use":"Email đã được đăng ký","auth/invalid-credential":"Sai email hoặc mật khẩu","auth/weak-password":"Mật khẩu tối thiểu 6 ký tự","auth/invalid-email":"Email không hợp lệ","auth/too-many-requests":"Thử lại sau ít phút"}[e.code]||e.message);
  B = {
    async register(email,name,pw){try{const c=await A.createUserWithEmailAndPassword(auth,email,pw);await A.updateProfile(c.user,{displayName:name});
        await F.setDoc(ref(c.user.uid),{email,name,credits:0,role:'user',createdAt:F.serverTimestamp()});
        if(email.toLowerCase()===ADMIN_EMAIL) A.sendEmailVerification(c.user).catch(()=>{});}catch(e){throw new Error(viaMsg(e))}},
    async login(email,pw){try{await A.signInWithEmailAndPassword(auth,email,pw)}catch(e){throw new Error(viaMsg(e))}},
    logout:()=>A.signOut(auth),
    onUser(cb){let un=()=>{};A.onAuthStateChanged(auth,u=>{un();if(!u)return cb(null);
        un=F.onSnapshot(ref(u.uid),s=>{const d=s.data()||{};cb({uid:u.uid,email:u.email,name:d.name||u.displayName||u.email,credits:d.credits||0,freeDay:d.freeDay||0,freeCount:d.freeCount||0,
          admin:u.email.toLowerCase()===ADMIN_EMAIL&&u.emailVerified,adminUnverified:u.email.toLowerCase()===ADMIN_EMAIL&&!u.emailVerified})})})},
    setCredits:(uid,n)=>F.updateDoc(ref(uid),{credits:n}),
    consume:uid=>F.updateDoc(ref(uid),{credits:F.increment(-1)}),
    addPaid:(uid,n,code)=>F.updateDoc(ref(uid),{credits:F.increment(n),lastOrder:code}),
    claimFree:(uid,day,n)=>F.updateDoc(ref(uid),{credits:F.increment(1),freeDay:day,freeCount:n}),
    async list(){const s=await F.getDocs(F.collection(db,'users'));return s.docs.map(d=>({uid:d.id,...d.data()}))}
  };
} else {
  const L=k=>JSON.parse(localStorage.getItem(k)||'null'), S=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
  let cb=()=>{};
  const push=()=>{const s=L('lq_s');const us=L('lq_u')||{};const u=s&&us[s];cb(u?{uid:s,email:s,name:u.name,credits:u.credits,freeDay:u.freeDay||0,freeCount:u.freeCount||0,admin:s===ADMIN_EMAIL}:null)};
  B={
    async register(e,n,p){const us=L('lq_u')||{};if(us[e])throw new Error("Email đã được đăng ký");us[e]={name:n,pw:p,credits:0};S('lq_u',us);S('lq_s',e);push()},
    async login(e,p){const us=L('lq_u')||{};if(!us[e]||us[e].pw!==p)throw new Error("Sai email hoặc mật khẩu");S('lq_s',e);push()},
    async logout(){localStorage.removeItem('lq_s');push()},
    onUser(f){cb=f;push()},
    async setCredits(uid,n){const us=L('lq_u');us[uid].credits=n;S('lq_u',us);push()},
    async consume(uid){const us=L('lq_u');us[uid].credits--;S('lq_u',us);push()},
    async addPaid(uid,n,code){const us=L('lq_u');us[uid].credits+=n;us[uid].lastOrder=code;S('lq_u',us);push()},
    async claimFree(uid,day,n){const us=L('lq_u');us[uid].credits++;us[uid].freeDay=day;us[uid].freeCount=n;S('lq_u',us);push()},
    async list(){const us=L('lq_u')||{};return Object.entries(us).map(([k,v])=>({uid:k,email:k,...v}))}
  };
}

/* ---------- State ---------- */
const st={landing:false,topup:false,user:null,step:1,device:'ios',role:'',q:'',picked:[],skin:{},cam:5};
const byId=Object.fromEntries(H.map(h=>[h.id,h]));

/* ---------- Auth UI ---------- */
function authView(mode='login'){
  const reg=mode==='register';
  $('#app').innerHTML=`<div class="card" style="margin-top:40px"><div class="logo" style="margin-bottom:12px">MQ</div>
  <h2 style="margin:0 0 4px">${reg?'Đăng ký tài khoản':'Đăng nhập'}</h2>
  <p class="sub" style="margin-bottom:14px">Make by Hiếu gamer${hasFB?'':' • Chế độ demo (chưa nối Firebase)'}</p>
  <div class="box" style="padding:0;box-shadow:none;max-height:none">
  ${reg?'<input id="a_name" placeholder="Tên hiển thị" maxlength="40">':''}
  <input id="a_mail" type="email" placeholder="Gmail (vd: ten@gmail.com)" autocomplete="email">
  <input id="a_pw" type="password" placeholder="Mật khẩu (≥ 6 ký tự)" autocomplete="${reg?'new-password':'current-password'}">
  ${reg?'<input id="a_pw2" type="password" placeholder="Nhập lại mật khẩu">':''}
  <p class="err" id="a_err"></p>
  <button class="cta" id="a_go">${reg?'Đăng ký':'Đăng nhập'}</button></div>
  <p style="text-align:center;margin:14px 0 0">${reg?'Đã có tài khoản?':'Chưa có tài khoản?'} <button class="link" id="a_sw">${reg?'Đăng nhập':'Đăng ký'}</button></p></div>`;
  $('#a_sw').onclick=()=>authView(reg?'login':'register');
  $('#a_go').onclick=async()=>{
    const e=$('#a_mail').value.trim().toLowerCase(),p=$('#a_pw').value,n=reg?$('#a_name').value.trim():'',err=m=>$('#a_err').textContent=m;
    if(!/^[^\s@]+@gmail\.com$/.test(e))return err('Vui lòng nhập đúng địa chỉ Gmail');
    if(p.length<6)return err('Mật khẩu tối thiểu 6 ký tự');
    if(reg&&!n)return err('Vui lòng nhập tên');
    if(reg&&p!==$('#a_pw2').value)return err('Mật khẩu nhập lại không khớp');
    $('#a_go').disabled=true;
    try{reg?await B.register(e,n,p):await B.login(e,p)}catch(x){err(x.message);$('#a_go').disabled=false}
  };
}

/* ---------- Header / credit ---------- */
function renderHeader(){
  const u=st.user;$('#hd').classList.toggle('hide',!u);if(!u)return;
  $('#cn').textContent=u.credits;$('#cn').classList.toggle('adm',u.admin);
  $('#av').textContent=(u.name||'?')[0].toUpperCase();$('#stepn').textContent=st.step;
}
$('#cn').onclick=async()=>{ // Admin bấm vào số để sửa số lượt
  const u=st.user;if(!u)return;
  if(!u.admin){return toast(u.adminUnverified?'Hãy xác minh email admin để dùng quyền admin':'Chỉ admin mới sửa được số lượt')}

const tfetch=(url,ms)=>{const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);return fetch(url,{signal:c.signal}).finally(()=>clearTimeout(t))};
async function shorten(sh,longUrl){
  const enc=encodeURIComponent(longUrl);
  for(const url of sh.api(sh.token,enc)){
    try{
      const r=await tfetch(url,3000);const t=await r.text();let j;try{j=JSON.parse(t)}catch(e){j=null}
      const hay=j?JSON.stringify(j).split('\\/').join('/'):t;
      const m=hay.match(/https?:\/\/[^\s"'<>\\]+/g)||[];
      const out=m.find(x=>!x.includes(location.host)&&!/\/api/i.test(x));
      if(out)return out;
    }catch(e){/* thử endpoint kế tiếp */}
  }
  return sh.quick(sh.token,enc); // dự phòng: link vượt trực tiếp (không cần CORS)
}
async function startFree(retry){
  const u=st.user,used=freeUsed(u);if(used>=FREE_PER_DAY)return toast('Hôm nay đã hết lượt free');
  const old=retry?getPend():null,code=old?old.code:rndCode(),sh=shortenerFor(used);
  const longUrl=location.origin+location.pathname+'?claim='+code;
  $('#modal').innerHTML=`<div class="modal"><div class="box" style="text-align:center"><h2>Đang tạo link ${esc(sh.name)}...</h2><p class="sub">Chờ vài giây</p></div></div>`;
  const quick=sh.quick(sh.token,encodeURIComponent(longUrl));
  let link=quick;
  try{link=await Promise.race([shorten(sh,longUrl),new Promise(r=>setTimeout(()=>r(quick),7000))])}catch(e){}
  setPend({uid:u.uid,code,sh:sh.name,link:link||quick,t:old?old.t:Date.now(),made:Date.now()});
  openTopup();
}
async function confirmCode(){
  const u=st.user,p=getPend(),v=$('#cd').value.trim().toUpperCase(),err=m=>$('#ce').textContent=m;
  if(!p)return renderTopup();
  if(v.length!==5)return err('Nhập đủ 5 ký tự');
  if(Date.now()-p.made<MIN_WAIT*1000)return err('Bạn chưa hoàn thành link, hãy vượt link rồi lấy mã');
  if(v!==p.code)return err('Mã không đúng, kiểm tra lại');
  const used=freeUsed(u);if(used>=FREE_PER_DAY){setPend(null);return renderTopup()}
  $('#cf').disabled=true;
  try{await B.claimFree(u.uid,dayNow(),used+1);setPend(null);toast('🎉 +1 điểm!');if(st.topup)renderTopup()}
  catch(e){$('#cf').disabled=false;err('Không cộng được điểm: '+(e.code==='permission-denied'?'hết lượt hôm nay hoặc lệch giờ máy':e.message))}
}

async function checkOrder(code){
  let why='';
  for(const f of (chkFile?[chkFile]:['check_order.php','check_order.php.php'])){
    try{
      const r=await fetch(PAY_API+f+'?code='+encodeURIComponent(code)+'&_='+Date.now(),{cache:'no-store'});
      const t=await r.text();let j;
      try{j=JSON.parse(t)}catch(e){why=r.ok?'server trả về trang lạ (InfinityFree có thể đang chặn)':'không tìm thấy '+f+' (HTTP '+r.status+')';continue}
      chkFile=f;return {status:String(j.status||'pending')};
    }catch(e){why='mất kết nối mạng'}
  }
  return {status:'error',why};
}
/* Kiểm tra đơn: dùng cho vòng lặp 3s, nút "Kiểm tra xác nhận" và lúc quay lại tab */
async function verifyPay(manual){
  const o=getOrder();if(!o||payBusy)return;
  if(manual)pst('🔎 Đang kiểm tra...');
  payBusy=true;
  try{
    const r=await checkOrder(o.code);
    if(r.status==='error'){if(manual)pst('⚠️ Không kiểm tra được: '+r.why);return}
    if(r.status!=='success'){pst(manual?'⏳ Chưa thấy tiền về (server báo: '+r.status+'). Chờ 10-30 giây rồi bấm lại.':'⏳ Đang chờ thanh toán...');return}
    pst('✅ Đã nhận tiền, đang cộng điểm...');
    const paid=JSON.parse(localStorage.getItem('lq_paid')||'[]');
    if(!paid.includes(o.code)){
      try{await B.addPaid(o.uid,o.cred,o.code);paid.push(o.code);localStorage.setItem('lq_paid',JSON.stringify(paid.slice(-50)))}
      catch(e){clearInterval(payTimer);pst('⚠️ Đã nhận tiền nhưng cộng điểm bị lỗi ('+(e.code||e.message)+'). Bấm "Kiểm tra xác nhận" để thử lại, hoặc nhắn admin kèm mã '+o.code);return}
    }
    clearInterval(payTimer);setOrder(null);toast(`✅ Nạp thành công +${o.cred} điểm`);if(st.topup)renderTopup();
  }finally{payBusy=false}
}

  document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{st.cam=+b.dataset.c;document.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b));foot()});
  function foot(){const d=st.picked.filter(i=>st.skin[i]!=null),u=st.user;
    bar(`<div class="row"><div class="logo" style="background:#fff;color:#0f172a">✨</div><div class="s"><b>${st.device==='ios'?'iOS':'Android'} • ${all} tướng • ${d.length} skin đã chọn</b><span>${d.length?d.map(i=>byId[i].name+': '+byId[i].skins[st.skin[i]][0]).join(' | '):'Chọn skin cho từng tướng để tạo file'} • Cam xa ${st.cam}%</span></div></div>
    <button class="go full" id="mk" ${d.length?'':'disabled'}>Tạo file ✨ ${u.credits<1?'(cần ≥ 1 điểm)':'(−1 điểm)'}</button>`);
    $('#mk').onclick=make}
  foot();
}

async function make(){
  const u=st.user;
  if(u.credits<1){const c=$('#credit');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake');return toast('Bạn cần ít nhất 1 điểm để tạo file')}
  const sel=st.picked.filter(i=>st.skin[i]!=null);if(!sel.length)return;
  $('#mk').disabled=true;
  try{await B.consume(u.uid)}catch(e){$('#mk').disabled=false;return toast('Không trừ được điểm: '+e.message)}
  const out={app:'Modskin LQ - Make by Hiếu gamer',createdAt:new Date().toISOString(),device:st.device,camXa:st.cam+'%',
    heroes:sel.map(i=>{const s=byId[i].skins[st.skin[i]];return{hero:byId[i].name,skin:s[0],tier:s[1]}})};
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,2)],{type:'application/json'}));
  a.download=`modskin_${st.device}_${Date.now()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  toast('Đã tạo file! Đã trừ 1 điểm');
}

/* ---------- Boot ---------- */
B.onUser(u=>{
  if(st.landing)return;
  st.user=u;
  if(!u){st.topup=false;clearInterval(payTimer);$('#modal').innerHTML='';$('#barwrap').innerHTML='';renderHeader();authView();return}
  renderHeader();
  if(!st.booted){st.booted=true;go(1);if(getOrder()){st.topup=true;renderPay();pollPay()}else if(getPend())openTopup()}else if(st.step===3)view3(); // cập nhật nút khi điểm đổi
  if(st.topup&&!$('#cd')&&!$('#payq'))renderTopup(); // làm mới số điểm trong popup
});
</script>
</body>
